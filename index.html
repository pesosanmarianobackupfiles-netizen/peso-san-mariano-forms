<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PESO San Mariano - NSRP Jobseeker Registration</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1f2937;
    }

    header {
        background: #0b63b6;
        color: white;
        text-align: center;
        padding: 30px 15px;
    }

    header h1 {
        margin: 0;
        font-size: 28px;
    }

    header p {
        margin: 8px 0 0;
        font-size: 15px;
    }

    .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
    }

    .card {
        background: white;
        border-radius: 12px;
        padding: 35px 25px;
        text-align: center;
        box-shadow: 0 3px 15px rgba(0,0,0,0.10);
    }

    .card h2 {
        margin-top: 0;
        color: #0b63b6;
    }

    .card p {
        line-height: 1.6;
    }

    .button {
        display: inline-block;
        margin-top: 20px;
        padding: 15px 30px;
        background: #0b63b6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 17px;
    }

    .button:hover {
        background: #084f91;
    }

    footer {
        text-align: center;
        color: #666;
        font-size: 13px;
        margin-top: 30px;
    }
</style>
</head>

<body>

<header>
    <h1>PESO San Mariano</h1>
    <p>Online Jobseeker Registration</p>
</header>

<div class="container">

    <div class="card">

        <h2>NSRP Jobseeker Registration Form</h2>

        <p>
            National Skills Registration Program (NSRP)
            Jobseeker Registration Form
        </p>

        <p>
            Please click the button below to access the
            online registration form.
        </p>

        <a class="button" href="./nsrp/">
            Open NSRP Registration Form
        </a>

    </div>

    <footer>
        PESO San Mariano, Isabela
    </footer>

</div>

</body>
</html>
